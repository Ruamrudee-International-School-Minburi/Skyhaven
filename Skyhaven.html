<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skyhaven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#22304f;--ink2:#5d6b8f;--panel:#ffffff;--panel2:#eef5ff;--line:#d7e4f6;--hud:rgba(255,255,255,.88);--sky:#36a9f5;--sky-d:#1f86d1;--pink:#ff6fa9;--pink-d:#d94c88;--butter:#ffd257;--butter-d:#e0ad2c;--mint:#36cf9c;--mint-d:#21a67a;--bg:#bfe6ff;--shade:rgba(34,48,79,.22);--scrim:rgba(255,255,255,.62);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eef3ff;--ink2:#a9b6d8;--panel:#1d2741;--panel2:#27335a;--line:#36466f;--hud:rgba(29,39,65,.88);--bg:#0e1630;--shade:rgba(0,0,0,.42);--scrim:rgba(14,22,48,.62);color-scheme:dark}}
:root[data-theme="dark"]{--ink:#eef3ff;--ink2:#a9b6d8;--panel:#1d2741;--panel2:#27335a;--line:#36466f;--hud:rgba(29,39,65,.88);--bg:#0e1630;--shade:rgba(0,0,0,.42);--scrim:rgba(14,22,48,.62);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:Fredoka,Nunito,ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:inherit}
.hidden{display:none!important}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:0;border-radius:999px;padding:.7em 1.35em;min-height:48px;font-weight:600;font-size:1.05rem;color:#fff;background:var(--sky);box-shadow:0 5px 0 var(--sky-d),0 10px 22px var(--shade);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sky-d),0 3px 8px var(--shade)}
.btn.pink{background:var(--pink);box-shadow:0 5px 0 var(--pink-d),0 10px 22px var(--shade)}
.btn.butter{background:var(--butter);color:#3d2c00;box-shadow:0 5px 0 var(--butter-d),0 10px 22px var(--shade)}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mint-d),0 10px 22px var(--shade)}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 5px 0 var(--line),0 10px 22px var(--shade)}
.btn.sm{min-height:40px;padding:.5em 1em;font-size:.95rem}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--butter);outline-offset:3px}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#loading{background:linear-gradient(180deg,#8fd3ff,#d7f0ff);flex-direction:column;gap:18px;color:#22304f;z-index:50}
.logo{margin:0;font-weight:700;line-height:.86;font-size:clamp(58px,13vw,128px);color:#fff;letter-spacing:-.01em;text-shadow:0 3px 0 #ffa8cb,0 6px 0 #ff8ab8,0 9px 0 #ff6fa9,0 18px 26px rgba(34,48,79,.28)}
.logo span{display:block}.logo span:first-child{transform:rotate(-4deg);transform-origin:left}.logo span:last-child{transform:rotate(2deg) translateX(.32em);color:#fff8d6}
#menu{justify-content:flex-start;padding-left:max(6vw,calc(16px + env(safe-area-inset-left,0px)))}
#menu::before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,var(--scrim),transparent 62%);pointer-events:none}
.menuCol{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:14px;max-width:min(420px,88vw)}
.tag{margin:6px 0 10px;font-size:1.15rem;font-weight:500;color:var(--ink)}
.menuBtns{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:min(260px,80vw)}
.note{font-size:.9rem;color:var(--ink2);margin:6px 0 0}
#hud{position:fixed;inset:0;pointer-events:none}
.pill{background:var(--hud);border:0;border-radius:999px;padding:.42em .85em;font-weight:600;font-size:15px;box-shadow:0 4px 14px var(--shade);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);white-space:nowrap;color:var(--ink)}
#hudTop{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:7px;flex-wrap:wrap;max-width:62vw}
#hudRight{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:7px;pointer-events:auto}
#hudRight button{cursor:pointer}
.round{width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:18px}
#taskCard{position:fixed;left:12px;top:calc(54px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:9px;max-width:min(380px,72vw);background:var(--hud);border-radius:20px;padding:7px 12px 7px 7px;box-shadow:0 4px 14px var(--shade);font-size:14px;font-weight:500;line-height:1.25}
#taskArrow{flex:none;width:30px;height:30px;border-radius:50%;background:var(--butter);display:grid;place-items:center;color:#3d2c00;font-size:15px;font-weight:700}
#prompt{position:fixed;left:50%;bottom:calc(118px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--hud);border-radius:999px;padding:8px 16px 8px 8px;box-shadow:0 6px 18px var(--shade);font-weight:600;white-space:nowrap}
#promptKey{width:32px;height:32px;border-radius:10px;background:var(--ink);color:var(--panel);display:grid;place-items:center;font-size:15px}
#promptBar{position:absolute;left:14px;right:14px;bottom:-7px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
#promptBar i{display:block;height:100%;width:0;background:var(--pink);border-radius:9px}
#toasts{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:max-content;max-width:90vw}
.toast{background:var(--hud);border-radius:999px;padding:7px 15px;font-weight:600;box-shadow:0 6px 18px var(--shade);animation:toast 2.8s forwards;font-size:15px}
@keyframes toast{0%{opacity:0;transform:translateY(-8px) scale(.94)}9%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
#subtitle{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(640px,88vw);background:rgba(20,28,52,.78);color:#fff;border-radius:16px;padding:8px 14px;font-size:15px;text-align:center;line-height:1.35}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.25);opacity:.85}
#photoHint{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);opacity:.75}
#touch{position:fixed;inset:0;pointer-events:none}
#stickZone{position:fixed;left:0;bottom:0;width:44vw;height:58vh;pointer-events:auto}
#stick{position:fixed;width:120px;height:120px;margin:-60px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.65);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 4px 10px rgba(0,0,0,.2)}
.tbtn{position:fixed;pointer-events:auto;width:62px;height:62px;border-radius:50%;border:0;background:var(--hud);font-size:24px;box-shadow:0 4px 14px var(--shade);display:grid;place-items:center}
.tbtn.on{background:var(--pink);color:#fff}
#tInteract{right:18px;bottom:calc(112px + env(safe-area-inset-bottom,0px));width:82px;height:82px;background:var(--butter);font-size:30px}
#tJump{right:112px;bottom:calc(34px + env(safe-area-inset-bottom,0px))}
#tRun{right:18px;bottom:calc(30px + env(safe-area-inset-bottom,0px))}
#tCam{right:112px;bottom:calc(112px + env(safe-area-inset-bottom,0px))}
#mini{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,94vw);max-height:64vh;overflow:auto;background:var(--panel);border-radius:28px;padding:16px 18px 18px;box-shadow:0 10px 0 rgba(0,0,0,.05),0 20px 50px var(--shade);pointer-events:auto;z-index:5}
#mini h3{margin:0;font-size:22px}
.mg-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.muted{color:var(--ink2);font-size:.95rem;margin:6px 0}
.ticket{display:flex;gap:14px;align-items:center;background:var(--panel2);border-radius:22px;padding:12px 14px;line-height:1.45;border:2px dashed var(--line)}
.face{font-size:42px;width:62px;height:62px;border-radius:50%;background:var(--panel);display:grid;place-items:center;flex:none}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tag{border:0;border-radius:16px;padding:9px 12px;min-height:48px;background:var(--c);color:#fff;font-weight:700;cursor:pointer;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.18);text-shadow:0 1px 2px rgba(0,0,0,.25)}
.tag small{display:block;font-weight:500;opacity:.95}
.tag:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.rowb{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.rowb .btn{flex:1 1 auto}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;margin:4px 0}
.chk input{width:22px;height:22px;accent-color:var(--pink)}
.meter{position:relative;height:16px;border-radius:9px;background:var(--panel2);overflow:hidden;margin:8px 0}
.meter i{position:absolute;top:0;bottom:0;left:0;background:var(--mint);border-radius:9px}
.meter b{position:absolute;top:-3px;bottom:-3px;width:4px;background:var(--pink);border-radius:2px}
.big{font-size:30px;font-weight:700}
.strip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);border-radius:18px;margin:8px 0}
.strip b{font-size:16px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);vertical-align:-1px;margin-right:6px}
#pause{background:rgba(20,30,60,.25);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:20}
#sheet{background:rgba(20,30,60,.25);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:30}
.card{background:var(--panel);border-radius:30px;padding:22px;width:min(560px,94vw);max-height:100%;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.05),0 24px 60px var(--shade)}
.card h2{margin:0 0 4px;font-size:30px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:2px dashed var(--line);font-weight:500}
.set:last-child{border-bottom:0}
input[type=range]{accent-color:var(--pink);width:min(200px,42vw)}
input[type=text]{font:inherit;font-weight:600;border:2px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:14px;padding:10px 12px;width:100%}
.seg{display:inline-flex;background:var(--panel2);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:.42em .85em;font-weight:600;cursor:pointer;min-height:36px}
.seg button.on{background:var(--sky);color:#fff}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--panel);outline:3px solid transparent;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14)}
.sw.on{outline-color:var(--ink)}
.lbl{font-weight:600;margin:14px 0 8px}
.slot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:20px;background:var(--panel2);margin:10px 0}
.slot .meta{font-size:.9rem;color:var(--ink2)}
.up{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;padding:12px 14px;border-radius:20px;background:var(--panel2);margin:10px 0}
.up p{margin:0;color:var(--ink2);font-size:.92rem}
.up.own{opacity:.7}
.logc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--panel2);margin:8px 0}
.logc .tail{width:26px;height:26px;border-radius:8px 8px 8px 2px;background:var(--c);flex:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.stats div{background:var(--panel2);border-radius:16px;padding:10px 12px}
.stats b{display:block;font-size:22px}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s;z-index:60}
@media (max-width:520px){.pill{font-size:13px;padding:.38em .7em}#hudTop{gap:5px}.card{padding:18px}.card h2{font-size:26px}}
@media (prefers-reduced-motion:reduce){.toast{animation-duration:3.2s}.btn{transition:none}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading" class="screen"><h1 class="logo"><span>Sky</span><span>haven</span></h1><p id="loadMsg" class="tag">Building your airport…</p></div>
<div id="hud" class="hidden">
 <div id="hudTop"><div class="pill" id="hCoins">🪙 0</div><div class="pill" id="hLevel">⭐ 1</div><div class="pill" id="hClock">07:30</div><div class="pill" id="hWx">☀️</div></div>
 <div id="hudRight"><button class="pill" id="btnRadio" aria-label="Change radio station">📻 Lo‑fi</button><button class="pill round" id="btnCam" aria-label="Switch camera">👁</button><button class="pill round" id="btnPause" aria-label="Pause">☰</button></div>
 <div id="taskCard" class="hidden"><div id="taskArrow">▲</div><div id="taskText"></div></div>
 <div id="prompt" class="hidden"><span id="promptKey">E</span><span id="promptText"></span><div id="promptBar"><i></i></div></div>
 <div id="toasts"></div>
 <div id="subtitle" class="hidden"></div>
 <div id="cross" class="hidden"></div>
</div>

<div id="touch" class="hidden"><div id="stickZone"></div><div id="stick" class="hidden"><div id="knob"></div></div><button class="tbtn" id="tInteract" aria-label="Interact">✋</button><button class="tbtn" id="tJump" aria-label="Jump">⤒</button><button class="tbtn" id="tRun" aria-label="Run">🏃</button><button class="tbtn" id="tCam" aria-label="Camera">👁</button></div>
<div id="mini" class="hidden"></div>
<div id="menu" class="screen hidden"><div class="menuCol"><h1 class="logo" aria-label="Skyhaven"><span>Sky</span><span>haven</span></h1><p class="tag">A cozy little airport sim</p><div class="menuBtns"><button class="btn butter" id="mContinue">Continue</button><button class="btn" id="mNew">New game</button><button class="btn ghost" id="mLoad">Load game</button><button class="btn ghost" id="mSettings">Settings</button><button class="btn ghost" id="mCredits">Credits</button></div><p class="note" id="menuNote"></p></div></div>
<div id="pause" class="screen hidden"><div class="card"><h2>Paused</h2><p class="muted" id="pauseSub"></p><div class="grid2"><button class="btn butter" id="pResume">Resume</button><button class="btn" id="pSave">Save game</button><button class="btn ghost" id="pLoad">Load game</button><button class="btn mint" id="pUpgrades">Upgrades</button><button class="btn ghost" id="pTravel">Quick travel</button><button class="btn ghost" id="pLog">Logbook</button><button class="btn ghost" id="pWardrobe">Wardrobe</button><button class="btn ghost" id="pSettings">Settings</button></div><div class="rowb"><button class="btn pink" id="pQuit">Save and quit to menu</button></div></div></div>
<div id="sheet" class="screen hidden"><div class="card"><h2 id="sheetTitle"></h2><div id="sheetBody"></div><div class="rowb"><button class="btn ghost" id="sheetBack">Back</button></div></div></div>
<div id="fade"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
if(!window.THREE){document.getElementById('loadMsg').textContent='Couldn’t load the 3D engine. Check your connection and reopen the page.';throw new Error('THREE missing')}
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a),randi=(a,b)=>Math.floor(a+Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2,PI=Math.PI;
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d};
const ease=t=>t*t*(3-2*t);
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const C=h=>new THREE.Color(h).convertSRGBToLinear();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const DEF_SET={master:.8,music:.45,sfx:.7,voice:.75,quality:isTouch?'medium':'high',sens:1,fov:72,bob:true,invert:false,dayLen:48,hints:true};
const settings=Object.assign({},DEF_SET,store.get('skyhaven.settings',{}));
const saveSettings=()=>store.set('skyhaven.settings',settings);
const FONT='Fredoka, Nunito, ui-rounded, system-ui, sans-serif';

// ===== renderer =====
const QUAL={low:{pr:.85,sh:0},medium:{pr:1.4,sh:1024},high:{pr:2,sh:2048}};
const renderer=new THREE.WebGLRenderer({antialias:settings.quality!=='low',powerPreference:'high-performance'});
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
$('#game').appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xc9ecff,400,2600);
const camera=new THREE.PerspectiveCamera(settings.fov,innerWidth/innerHeight,.25,9000);
const hemi=new THREE.HemisphereLight(0xffffff,0x88aa77,.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1.5);
sun.shadow.bias=-.0004;sun.shadow.normalBias=.05;
Object.assign(sun.shadow.camera,{left:-80,right:80,top:80,bottom:-80,near:10,far:900});
scene.add(sun,sun.target);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
function applyQuality(){const q=QUAL[settings.quality]||QUAL.medium;renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,q.pr));const on=q.sh>0;sun.castShadow=on;renderer.shadowMap.enabled=on;if(on&&sun.shadow.mapSize.x!==q.sh){sun.shadow.mapSize.set(q.sh,q.sh);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}}scene.traverse(o=>{if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.needsUpdate=true)});camera.fov=settings.fov;resize()}
addEventListener('resize',resize);

// ===== materials =====
const MAT={
 v:new THREE.MeshStandardMaterial({vertexColors:true,roughness:.82}),
 vs:new THREE.MeshStandardMaterial({vertexColors:true,roughness:.38,metalness:.08}),
 plane:new THREE.MeshStandardMaterial({vertexColors:true,roughness:.42,metalness:.06}),
 mark:new THREE.MeshStandardMaterial({vertexColors:true,roughness:.7,polygonOffset:true,polygonOffsetFactor:-3,polygonOffsetUnits:-6}),
 glow:new THREE.MeshBasicMaterial({vertexColors:true,toneMapped:false}),
 glowB:new THREE.MeshBasicMaterial({vertexColors:true,toneMapped:false}),
 beacon:new THREE.MeshBasicMaterial({color:0xff2a40,toneMapped:false}),
 glass:new THREE.MeshStandardMaterial({color:C('#cdeeff'),roughness:.06,metalness:.25,transparent:true,opacity:.3,depthWrite:false,side:THREE.DoubleSide,emissive:C('#ffcf8a'),emissiveIntensity:0}),
};

// ===== geometry helpers =====
const GC=new Map();
function rbox(w,h,d,r=.2,s=2){r=Math.max(.001,Math.min(r,w/2-.001,h/2-.001,d/2-.001));const k='rb'+[w,h,d,r,s].map(v=>(+v).toFixed(3)).join(',');if(GC.has(k))return GC.get(k);

 if(w.kind==='board'&&(a==='board'||a==='wait')){const n=w.n,g=w.g,f=g.f;if(!n||n.st!=='gq')return;const can=n.group<=f.group;if(a==='board'){if(can){reward(4,3,'Boarded');game.stats.mini++;boardPax(n,g)}else{sfx('bad');toast(`Group ${n.group} isn’t called yet. They’ll wait.`);sendBack(n,g)}}else{if(!can){reward(4,3,'Good catch');sendBack(n,g)}else{toast('They could have boarded. Welcome them aboard next time.');boardPax(n,g)}}renderWork(true);return}
 if(w.kind==='cafe'){const n=w.n;if(a==='item'){if(w.tray.length<4)w.tray.push(v);renderCafe();return}if(a==='clear'){w.tray=[];renderCafe();return}if(a==='serve'&&n&&n.st==='cafeQ'){const A=w.tray.slice().sort().join(),B=n.order.slice().sort().join();if(A===B){reward(7+randi(1,5),3,'Order served');game.stats.mini++;serveCafe(n);w.tray=[];renderWork(true)}else{sfx('bad');toast('Not quite their order. Try again.');w.tray=[];renderCafe()}}return}
 if(w.kind==='sort'&&a==='lane'&&w.bag){const f=w.bag.f;if(v===f.dep){f.sorted++;reward(3,2,null);if(f.sorted>=f.bags){bagsReady(f);reward(10,6,`Bags for ${f.dep} are ready to load`)}w.bag=null;renderWork(true)}else{sfx('bad');toast('That bag goes to a different cart.')}return}
 if(w.kind==='tower'){const p=findP(v);if(!p)return;
  if(a==='land'&&p.state==='approach'&&!p.cleared){const safe=rwFree(p);p.cleared=true;if(safe)reward(12,5,'Cleared to land');else{sfx('bad');toast('The runway is busy. They may have to go around.')}}
  if(a==='to'&&p.state==='hold'&&!p.toCleared){const safe=lineupSafe(p);p.toCleared=true;if(safe)reward(12,5,'Cleared for takeoff');else{sfx('bad');toast('Traffic on final. Watch for a go-around.')}}
  if(a==='push'&&p.state==='parked'&&!p.pushOK){const safe=canPush(p);p.pushOK=true;if(safe)reward(10,4,'Pushback approved');else toast('The taxiway is busy. They’ll wait their turn.')}
  renderTower(true);return}
 if(w.kind==='marshal'){if(a==='mzL')w.latV-=.5;else if(a==='mzR')w.latV+=.5;else if(a==='mzStop'){if(w.final)w.stopped=true;else toast('Wait until it’s lined up with you')}}}
function updDesks(dt){const w=game.work;desks.forEach((D,i)=>{if(w&&w.kind==='desk'&&w.d===i)return;const n=D.q[0];if(n&&n.st==='deskQ'){D.t+=dt;if(D.t>2.4){D.t=0;checkIn(n)}}else D.t=0});
 const n=cafe.q[0];if(!(w&&w.kind==='cafe')){if(n&&n.st==='cafeQ'){cafe.t+=dt;if(cafe.t>6){cafe.t=0;serveCafe(n)}}else cafe.t=0}else{cafe.pull+=dt;if(cafe.pull>5){cafe.pull=0;if(cafe.q.length<3){const c=npcs.find(x=>x.kind==='dep'&&x.st==='seated'&&x.f.phase!=='boarding');if(c)goCafe(c)}}}}

const RADIO=[{n:'Lo-fi Lounge',short:'Lo‑fi',bpm:74,k:'lofi'},{n:'Runway Jazz',short:'Jazz',bpm:104,k:'jazz'},{n:'Cloud Ambient',short:'Ambient',bpm:58,k:'amb'},{n:'Radio off',short:'Off',k:'off'}];
function initAudio(){if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}const A=window.AudioContext||window.webkitAudioContext;if(!A)return;try{const c=new A();AU.ctx=c;const g=()=>c.createGain();

 AU.lp=c.createBiquadFilter();AU.lp.type='lowpass';AU.lp.frequency.value=2400;AU.lp.connect(AU.music);
 const N=c.sampleRate*2,mk=f=>{const b=c.createBuffer(1,N,c.sampleRate),d=b.getChannelData(0);f(d);return b};
 AU.white=mk(d=>{for(let i=0;i<N;i++)d[i]=Math.random()*2-1});AU.brown=mk(d=>{let l=0;for(let i=0;i<N;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}});
 const crackle=mk(d=>{for(let i=0;i<N;i++)d[i]=(Math.random()<.0007?(Math.random()*2-1)*.7:0)+(Math.random()*2-1)*.01});
 const loop=(buf,type,f,q)=>{const s=c.createBufferSource();s.buffer=buf;s.loop=true;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;if(q)fl.Q.value=q;const gn=g();gn.gain.value=0;s.connect(fl);fl.connect(gn);gn.connect(AU.amb);s.start();return{gn,fl}};

 AU.eng=[0,1].map(()=>{const e=loop(AU.brown,'lowpass',600),o=c.createOscillator(),bp=c.createBiquadFilter(),og=g();o.type='sawtooth';o.frequency.value=300;bp.type='bandpass';bp.frequency.value=1200;bp.Q.value=4;og.gain.value=0;o.connect(bp);bp.connect(og);og.connect(AU.amb);o.start();Object.assign(e,{o,bp,og});return e});

 if(S.k==='lofi'){if(s===0)ch.forEach((n,i)=>keysN(mf(n+12),t+i*.015,spb*15,.04));if(s===10&&Math.random()<.55)ch.slice(1).forEach(n=>keysN(mf(n+12),t,spb*4,.028));if(s===0||s===10||(s===7&&Math.random()<.4))kick(t,.4);if(s===4||s===12)hit(t,'bandpass',1800,.13,.16);if(s%2===0)hit(t,'highpass',7000,s%4===2?.045:.028,.04);if(s===0||s===8)bassN(mf(ch[0]-12),t,spb*7);if(s%2===0&&Math.random()<.12)keysN(mf(pick(ch)+24),t,spb*3,.022)}
